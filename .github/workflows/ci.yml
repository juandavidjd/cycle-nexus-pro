name: Frontend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - pciii/f1a-k0-consumer-r1-20260821

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Typecheck
        run: ./node_modules/.bin/tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npm run build
